<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="logo">
        <h1>Shopping List</h1>
    </div>

    <div class="input-container" id="inputContainer">
        <input type="text" id="itemInput" placeholder="item...">
        <input type="number" id="priceInput" placeholder="price..." min="0" step="0.01">
        <button type="button" onclick="addTask()">Add</button>
    </div>

        <div class="checkbox-container"></div>
    

    <div class="task-list" id="taskListContainer">
        <ul id="taskList"></ul>
    </div>

    <div id="clearButtonContainer">
        <button type="button" onclick="clearList()">Clear List</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
